name: ScanDis CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'   # always resolves to current stable Dart/Flutter — avoids pin drift like this failure
          cache: true

      - name: Generate missing platform folders (android/ios)
        # This repo ships only lib/ + pubspec.yaml — no local Flutter SDK needed
        # on your machine. This step scaffolds android/ and ios/ directly in CI
        # if they don't already exist, without touching lib/ or pubspec.yaml.
        # Must run before `pub get` so plugins register their platform code.
        run: flutter create --platforms=android,ios --org com.scandis .

      - name: Ensure Android SDK Platform 36 is installed (best-effort)
        # Flutter's own bundled flutter_plugin_android_lifecycle now requires
        # compiling against API 36+, and any older plugin (file_picker today,
        # potentially others tomorrow) can hit this. GitHub-hosted runners are
        # usually current, but this is a harmless no-op if already installed.
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found on PATH — assuming the runner image already has it."
          fi

      - name: Patch Android build — universal namespace + compileSdk floor
        # ONE generic fix instead of chasing individual plugins one at a time.
        # Root cause: AGP 8+ requires every Android module to declare a
        # `namespace`, and Flutter's bundled flutter_plugin_android_lifecycle
        # now requires every module in the dependency graph to compile
        # against API 36+. Older/unmaintained plugins (isar_flutter_libs,
        # file_picker as of this writing, and possibly others later) don't
        # meet one or both of these on their own.
        #
        # Rather than patching each plugin individually (which breaks again
        # the next time a *different* plugin lags behind), this forces BOTH
        # requirements on every Android subproject — app and all plugins —
        # at Gradle configuration time. This is a blanket, forward-looking
        # fix: any plugin added later with the same class of problem is
        # covered automatically, no CI edit needed.
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val fixAndroidConfig: () -> Unit = fix@{
                  val androidExt = project.extensions.findByName("android")
                  if (androidExt !is com.android.build.gradle.BaseExtension) return@fix

                  // 1) Namespace floor (AGP 8+ requirement)
                  if (androidExt.namespace == null) {
                      val manifestFile = project.file("src/main/AndroidManifest.xml")
                      if (manifestFile.exists()) {
                          val text = manifestFile.readText()
                          val match = Regex("package=\"([^\"]+)\"").find(text)
                          if (match != null) {
                              androidExt.namespace = match.groupValues[1]
                          }
                      }
                  }

                  // 2) compileSdk floor (flutter_plugin_android_lifecycle requirement)
                  val current = androidExt.compileSdkVersion
                      ?.removePrefix("android-")
                      ?.toIntOrNull() ?: 0
                  if (current < 36) {
                      androidExt.compileSdkVersion = "android-36"
                  }
              }
              // Flutter's own generated build.gradle.kts forces early evaluation
              // of :app via evaluationDependsOn(":app"), so by the time this runs
              // some subprojects may already be evaluated — calling afterEvaluate
              // on those throws "already evaluated". Apply immediately if so.
              if (project.state.executed) {
                  fixAndroidConfig()
              } else {
                  project.afterEvaluate { fixAndroidConfig() }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'EOF'

          subprojects {
              def fixAndroidConfig = {
                  def androidExt = project.extensions.findByName('android')
                  if (androidExt == null) return

                  // 1) Namespace floor (AGP 8+ requirement)
                  if (androidExt.namespace == null) {
                      def manifestFile = project.file('src/main/AndroidManifest.xml')
                      if (manifestFile.exists()) {
                          def manifest = new XmlSlurper().parse(manifestFile)
                          def packageName = manifest.@package.text()
                          if (packageName) {
                              androidExt.namespace = packageName
                          }
                      }
                  }

                  // 2) compileSdk floor (flutter_plugin_android_lifecycle requirement)
                  def currentStr = androidExt.compileSdkVersion
                  def current = currentStr ? (currentStr.replace('android-', '') as Integer) : 0
                  if (current < 36) {
                      androidExt.compileSdkVersion = 'android-36'
                  }
              }
              // Flutter's own generated build.gradle forces early evaluation of
              // :app via evaluationDependsOn(":app"), so by the time this runs
              // some subprojects may already be evaluated — calling afterEvaluate
              // on those throws "already evaluated". Apply immediately if so.
              if (project.state.executed) {
                  fixAndroidConfig()
              } else {
                  project.afterEvaluate { fixAndroidConfig() }
              }
          }
          EOF
          else
            echo "No android/build.gradle(.kts) found — skipping patch."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar schema code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
        continue-on-error: true   # remove once the codebase is lint-clean

      - name: Run tests
        run: flutter test
        continue-on-error: true   # remove once a test/ suite exists

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scandis-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
