name: ScanDis CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Create Flutter project shell scaffolding
        run: flutter create . --org com.yourcompany --project-name scandis

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Isar namespace for AGP
        run: |
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ]; then
            echo "Patching Isar build.gradle..."
            sed -i 's/android {/android {\n    namespace "dev.isar.isar_flutter_libs"/' "$ISAR_GRADLE"
          fi

      - name: Generate Isar schema code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scandis-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
