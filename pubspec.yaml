name: scandis
description: 100% on-device, zero-cloud document scanner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Local Storage / Encryption ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.2.2   # holds the Isar AES encryption key in Keychain/Keystore
  path_provider: ^2.1.4

  # --- Scanning / OCR / TTS (all on-device ML Kit, no network calls) ---
  google_mlkit_document_scanner: ^0.4.0
  google_mlkit_text_recognition: ^0.13.1
  flutter_tts: ^4.0.2

  # --- Reordering / UI ---
  reorderable_grid_view: ^2.2.8
  google_fonts: ^6.2.1

  # --- PDF / Image processing ---
  # NOTE: syncfusion_flutter_pdf is a commercial package (free under the
  # Syncfusion Community License for qualifying individuals/small teams,
  # see https://www.syncfusion.com/products/communitylicense). It runs
  # 100% on-device — no network calls — which is why it's used here for
  # merge/split/encryption, none of which the pure-Dart `pdf` package
  # supports. Swap for a different engine if the license terms don't fit.
  syncfusion_flutter_pdf: ^27.1.58
  image: ^4.2.0
  signature: ^5.5.0           # canvas-based signature capture
  path: ^1.9.0
  share_plus: ^10.1.2          # local share-sheet export, not a network call

  # --- State ---
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
